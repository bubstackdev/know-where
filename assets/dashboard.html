<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>know-where · Router console</title><link rel="stylesheet" href="/ui/assets/style.css"><script defer src="/ui/assets/app.js"></script></head>
<body><header class="mast"><a class="brand" href="/ui"><span aria-hidden="true" class="mark">↳</span> know-where <small>Router console</small></a><nav aria-label="Main"><a href="/ui" data-nav="monitor">Monitoring</a><a href="/ui/settings" data-nav="settings">Settings</a></nav><span id="connection" role="status">Connecting…</span></header><main id="main"><p class="loading">Loading router…</p></main><div id="notice" role="status" aria-live="polite" hidden></div><dialog id="model-dialog"><form id="model-form"><header><h2 id="model-title">Add model</h2><button type="button" class="quiet" data-action="close-model" aria-label="Close model editor">×</button></header><input type="hidden" name="existing_id"><div class="form-grid"><label>Router model ID<input name="id" required maxlength="200" autocomplete="off"></label><label>Provider<select name="provider"><option value="local">Local</option><option value="claude">Claude</option><option value="codex">Codex</option><option value="openrouter">OpenRouter</option><option value="systemone">SystemOne</option></select></label><label class="wide">Upstream model ID<input name="upstream_model_id" required list="discovered-models"></label><label class="wide">Base URL<input name="base_url" placeholder="http://127.0.0.1:1234/v1" type="url"></label><label>Context window<input name="context_window" type="number" min="1" placeholder="No limit"></label><label>Max prompt tokens<input name="max_prompt_tokens" type="number" min="1" placeholder="No cap"></label><label>Max conversations<input name="max_conversations" type="number" min="1" placeholder="No limit"></label><label>Replacement API key<input name="new_api_key" type="password" autocomplete="new-password" placeholder="Keep current key"></label><label class="check"><input name="enabled" type="checkbox" checked> Enabled</label><label class="check"><input name="supports_tools" type="checkbox" checked> Tool calls</label><label class="check"><input name="supports_vision" type="checkbox"> Images</label><label class="check"><input name="clear_api_key" type="checkbox"> Remove stored API key</label><label class="wide">Reasoning effort mapping (JSON, optional)<textarea name="effort" rows="3" placeholder='{"mode":"reasoning_effort","levels":["low","medium","high"]}'></textarea></label><label class="wide">OpenRouter routing options (JSON, optional)<textarea name="open_router" rows="3" placeholder='{"order":["provider"],"allow_fallbacks":true}'></textarea></label><label class="wide">SystemOne supported decisions (comma-separated)<input name="decisions" placeholder="choice, noul, score, images, videos"></label></div><footer><button type="button" data-action="test-connection" class="secondary">Test connection</button><span class="spacer"></span><button type="button" data-action="close-model" class="secondary">Cancel</button><button type="submit">Save model</button></footer><p id="model-status" role="status"></p></form></dialog><dialog id="key-dialog"><form id="key-form"><h2>OpenRouter API key</h2><p class="muted">The replacement key is encrypted before it is stored.</p><label>API key<input name="key" type="password" required autocomplete="new-password"></label><footer><button type="button" class="secondary" data-action="close-key">Cancel</button><button>Save API key</button></footer></form></dialog><datalist id="discovered-models"></datalist></body></html>
